
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="cal.css">
    <script src="calculator.js"></script>
</head>
<body>

    <div class="calculator">
        <h1>Tip Calculator</h1>

        <form id="tip-form">

            <div>
                <label for="billAmount">Bill Amount ($):</label>
                <input type="number" id="billAmount"
                       min="0" step="0.01"
                       placeholder="Enter bill amount">
            </div>

            <div>
                <label for="serviceQuality">Service Quality:</label>
                <select id="serviceQuality">
                    <option value="0.25">Excellent - 25%</option>
                    <option value="0.20">Good - 20%</option>
                    <option value="0.15">Fair - 15%</option>
                    <option value="0.10">Poor - 10%</option>
                </select>
            </div>

            <button type="button" id="calculateBtn">
                Calculate Tip
            </button>

            <p id="tipOutput"></p>

        </form>
    </div>

</body>
</html>
