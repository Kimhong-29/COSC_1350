<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="cal.css">
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="inspirations.html">Inspirations</a>
        <a href="calculator.html">Tip Calculator</a>
    </nav>

    <div class="calculator">

        <h1>Tip Calculator</h1>

        <form id="tip-form">

            <label for="billAmount">Bill Amount:</label>

            <input
                type="number"
                id="billAmount"
                name="billAmount"
                step="0.01"
                required
            >

            <label for="serviceQuality">Service Quality:</label>

            <select id="serviceQuality" name="serviceQuality">
                <option value="0.25">Excellent (25%)</option>
                <option value="0.20">Good (20%)</option>
                <option value="0.15">Fair (15%)</option>
                <option value="0.10">Poor (10%)</option>
            </select>

            <button type="submit">Calculate Tip</button>

        </form>

    </div>

    <script src="calculator.js"></script>

</body>

</html>
